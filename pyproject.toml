[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ptvision"
version = "0.1.0"
description = "CV tool to assist PTs"
readme = "README.md"
license = "Unlicense"
license-files = ["LICENSE", "NOTICE", "src/ptvision/_vendor/pose2sim/LICENSE"]
requires-python = ">=3.12,<3.14"
authors = [{ name = "Reilly Koren" }]
keywords = ["physical-therapy", "pose-estimation", "biomechanics", "rehabilitation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "rtmlib==0.0.16",
  "onnxruntime>=1.29,<2",
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "pandas>=2.3,<4",
  "pyarrow>=21,<26",
  "pydantic>=2.11,<3",
  "typer>=0.16,<1",
  "jinja2>=3.1,<4",
  "matplotlib>=3.10,<4",
  "platformdirs>=4.3,<5",
  "certifi>=2025.1",
  "opencv-python>=5,<6",
]

[project.optional-dependencies]
app = [
    "pyqtgraph>=0.14,<0.15",
    "pyside6-essentials>=6.11.2,<7",
]
datasets = [
    "ezc3d>=1.7,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-cov>=6",
  "ruff>=0.12",
  "mypy>=1.17",
  "pre-commit>=4.2",
  "pandas-stubs",
]
qt = [
    "pytest-qt>=4.4,<5",
]

[project.scripts]
ptv = "ptvision.cli.main:app"

[project.urls]
Repository = "https://github.com/rkoren/pt-vision"

[tool.hatch.build.targets.wheel]
packages = ["src/ptvision"]

[tool.uv]
# install command: `uv sync --extra app --extra datasets`
default-groups = ["dev", "qt"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/ptvision/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY", "PD", "RUF", "SIM", "PTH"]
ignore = ["RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "PD", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "model: requires downloaded ONNX weights (run `ptv models pull` first)",
  "slow: slow test",
  "qt: needs PySide6 and pytest-qt (installed by the standard `uv sync`)",
]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:rtmlib.*"]

[tool.mypy]
python_version = "3.12"
exclude = ["src/ptvision/_vendor"]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["ptvision.clinical.*", "ptvision.trials.*"]
strict = true
