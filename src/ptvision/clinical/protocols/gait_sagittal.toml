[protocol]
id = "gait_sagittal"
version = "0.1.0"
name = "Walkway gait (sagittal)"
family = "gait"
summary = "Comfortable-speed walking across the frame, filmed from the side: timing, cadence, symmetry, speed and sagittal knee/hip angles."

[capture]
view = "sagittal"
distance_m = 4.5
camera_height_m = 1.0
min_fps = 24
duration_s = [3, 900]
required_keypoints = ["LHip", "RHip", "LKnee", "RKnee", "LAnkle", "RAnkle", "LHeel", "RHeel", "LBigToe", "RBigToe", "Hip"]
instructions = """Camera on a tripod about 1 m high, 4–5 m from the walkway line, perpendicular to it, landscape.
Whole body visible for the entire crossing. Start walking at least 2 m before entering the frame and
keep going past the far edge so the frame holds steady-state walking. Several passes in each direction.
Enter the subject's height so speed and step length can be reported in metres."""

[pose]
backend = "rtmlib"
model = "body_with_feet"

[preprocess]
score_threshold = 0.3
interp_max_gap_s = 0.3
filter_type = "butterworth"
filter_order = 4
filter_cutoff_hz = 6.0
segment_signal_cutoff_hz = 6.0

[scale]
method = "subject_height"      # none | subject_height
floor_angle = "auto"           # auto | degrees

[segmenter]
name = "gait_zeni"
version = "0.1.0"
method = "coordinate"          # coordinate | velocity (Zeni 2008)
min_stride_s = 0.6
max_stride_s = 2.5
prominence_frac = 0.15
min_cycles = 3
drop_edge_cycles = 1
edge_margin_frac = 0.05
bout_min_s = 1.0
bout_speed_frac = 0.15

[[metrics]]
name = "gait_speed"
primary = true
norm = "gait_speed_bohannon2011"

[[metrics]]
name = "cadence"

[[metrics]]
name = "stride_time"

[[metrics]]
name = "stance_pct"

[[metrics]]
name = "swing_pct"

[[metrics]]
name = "double_support_pct"

[[metrics]]
name = "step_time_symmetry"

[[metrics]]
name = "stance_time_symmetry"

[[metrics]]
name = "step_length"

[[metrics]]
name = "stride_length"

[[metrics]]
name = "n_gait_cycles"

[[metrics]]
name = "peak_knee_flexion_swing"

[[metrics]]
name = "peak_hip_flexion"

# Provisional sagittal bands for the skeleton colouring; confirm with the PT partner (B02).
[[rules]]
angle = "knee_flexion"
label = "Knee flexion"
ok = [0, 75]
warn = [0, 90]
note = "provisional, confirm with PT"

[[rules]]
angle = "trunk_lean"
label = "Trunk forward lean"
ok = [-5, 15]
warn = [-10, 25]
note = "provisional, confirm with PT"

[report]
template = "gait.html.j2"
angles = ["knee_flexion", "hip_flexion", "trunk_lean"]
