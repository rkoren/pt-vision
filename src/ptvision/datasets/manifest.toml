# [REVIEW] new file
# Public datasets used for validation. Every entry records the license we rely on and the exact
# file checksums as published by the host on 2026-09-22. Files land under
# $PTV_DATASETS_DIR/<name>/raw/ (default ~/ptvision-data/datasets); nothing here is ever committed.
# `size` is the exact byte count reported by the host; a download that ends short is an error.

[datasets.fukuchi2018]
title = "A public data set of overground and treadmill walking kinematics and kinetics of healthy individuals"
citation = "Fukuchi CA, Fukuchi RK, Duarte M. PeerJ 2018;6:e4640. doi:10.7717/peerj.4640"
source = "https://figshare.com/articles/dataset/5722711"
license = "CC BY 4.0"
license_url = "https://creativecommons.org/licenses/by/4.0/"
kind = "mocap"
notes = "Use WBDSc3dWithGaitEvents.zip: the newer WBDSc3d.zip (v6) lacks the EVENT labels. 24 young + 27 older adults, overground and treadmill at several speeds."
files = [
  { url = "https://ndownloader.figshare.com/files/12403928", name = "WBDSc3dWithGaitEvents.zip", md5 = "ee7010dfcd3ee223f5e5d63dd369f124", size = 732934431, extract = true },
  { url = "https://ndownloader.figshare.com/files/68504641", name = "WBDSinfo.csv", md5 = "35bc5abde86db7cd56532e2605adb138", size = 640894 },
]

