# Public datasets used for validation. Every entry records the license we rely on and the exact
# file checksums as published by the host on 2026-09-22. Files land under
# $PTV_DATASETS_DIR/<name>/raw/ (default ~/ptvision-data/datasets); nothing here is ever committed.
# `size` is the exact byte count reported by the host; a download that ends short is an error.

[datasets.uiprmd]
title = "UI-PRMD: University of Idaho Physical Rehabilitation Movements Data Set"
citation = "Vakanski A, Jun HP, Paul D, Baker R. Data 2018;3(1):2. doi:10.3390/data3010002"
source = "http://web.archive.org/web/20250424230129/https://www.webpages.uidaho.edu/ui-prmd/"
license = "PDDL v1.0"
license_url = "https://opendatacommons.org/licenses/pddl/1-0/"
kind = "skeleton"
notes = "Original site returns 404 (2026-09); files served from the Wayback Machine capture of 2024-07-07. No RGB video; Vicon and Kinect joint positions/angles, 10 movements incl. sit-to-stand (m05), correct and incorrect."
files = [
  { url = "https://web.archive.org/web/20240707205857if_/https://www.webpages.uidaho.edu/ui-prmd/Segmented%20Movements.zip", name = "Segmented Movements.zip", size = 206962745, extract = true },
  { url = "https://web.archive.org/web/20240707205753if_/https://www.webpages.uidaho.edu/ui-prmd/Incorrect%20Segmented%20Movements.zip", name = "Incorrect Segmented Movements.zip", size = 213516724, extract = true },
]


[datasets.opencap]
title = "OpenCap LabValidation: synchronised iPhone videos, marker mocap and force plates"
citation = "Uhlrich SD, Falisse A, Kidzinski L, et al. PLOS Comput Biol 2023;19(10):e1011462. doi:10.1371/journal.pcbi.1011462"
source = "https://www.opencap.ai/data"
license = "see source page (no license file in the archive; cite the paper)"
license_url = "https://www.opencap.ai/data"
kind = "video+mocap+forces"
manual = true
notes = "Manual download (Google Drive folder 'LabValidation_withVideos', 23 GB) from the OpenCap data page; unpack so that raw/subject2/VideoData/... exists. 10 subjects (subject6 has no video), 5 iPhones at 60 Hz, 100 Hz mocap with OpenSim inverse kinematics, 2 kHz force plates; sit-to-stand trials STS1 and STSweakLegs1."
files = []
